# Model arguments
model_name_or_path: /home/share/models/Qwen2.5-3B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: open-r1/data/0705_2k/filter/train.json
dataset_prompt_column: question
system_prompt: "You are a real person with a Chinese cultural background. Please answer the questions honestly according to your own culture value system. Your responses must reflect a clear personal stance—do not be vague, avoid saying “However”, “both sides are valid” or giving contradictory answers. Always express a definite and culturally grounded opinion."

# GRPO trainer config
bf16: true
use_vllm: false
do_eval: false
# eval_strategy: steps 
# eval_steps: 30

loss_type: dr_grpo

gradient_accumulation_steps: 2
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
# hub_model_id: Qwen2.5-1.5B-Open-R1-GRPO
# hub_strategy: every_save
learning_rate: 5.0e-05
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine
max_prompt_length: 512
max_completion_length: 1024
max_steps: -1
num_generations: 8
num_train_epochs: 1
output_dir: run/Qwen2.5-3B-cnValue-Open-R1-GRPO
overwrite_output_dir: true
per_device_eval_batch_size: 8
per_device_train_batch_size: 4
# push_to_hub: true
report_to:
- wandb
reward_funcs:
- cn_value_align_v2
reward_weights:
- 1.0
save_strategy: "epoch"
save_total_limit: 3
seed: 42
warmup_ratio: 0.1

# LORA Config
use_peft: true
lora_r: 16
lora_alpha: 16
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj